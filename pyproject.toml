[build-system]
requires = ["setuptools>=74.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseqzero"
version = "1.1.0"
description = "Use PyPulseq for MRI sequence definitions in MR-zero"
readme = "README.md"
authors = [
  { name = "Jonathan Endres", email = "jonathan.endres@uk-erlangen.de" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "mrzerocore>=0.4.7",
    "numpy>=2.4.4",
    "pypulseq>=1.4",
]

[project.optional-dependencies]
# pulseqzero.sim.Rapisim. fastmcp has to match the version of the MCP gateway
# (https://github.com/mrx-org/mcp-gateway), see its README ("Tool bundling")
rapisim = [
    "fastmcp==4.0.0b3",
    "httpx2",
    "keyring",
    "py-key-value-aio[keyring]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # write_ute.py imports pyplot at module level
    "matplotlib",
    "pypulseq>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/pulseq-frame/pulseq-zero"

[tool.uv.workspace]
members = ["demo"]
